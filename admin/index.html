<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理画面 | LoveGod</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- Login screen -->
<div class="container" id="loginScreen">
  <header class="shop-header">
    <h1>管理画面</h1>
    <p>LoveGod 遠隔ドリンク管理</p>
  </header>
  <div class="card">
    <label for="loginUser">ユーザー名</label>
    <input type="text" id="loginUser" autocomplete="username">
    <label for="loginPass">パスワード</label>
    <input type="text" id="loginPass" autocomplete="current-password" style="-webkit-text-security: disc;">
    <p class="error-text" id="loginError" style="display:none"></p>
    <button class="primary" id="loginBtn">ログイン</button>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard" style="display:none">
  <div class="admin-topbar">
    <h2>LoveGod 管理画面</h2>
    <button class="mini-btn" id="logoutBtn">ログアウト</button>
  </div>
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="orders">注文</button>
    <button class="tab-btn" data-tab="casts">キャスト</button>
    <button class="tab-btn" data-tab="drinks">ドリンク</button>
    <button class="tab-btn" data-tab="settings">決済設定</button>
    <button class="tab-btn" data-tab="account">アカウント</button>
  </div>

  <div class="container">
    <!-- Orders tab -->
    <div class="tab-panel" id="tab-orders">
      <div class="tab-bar" style="padding:0 0 12px">
        <button class="tab-btn active" data-status="all">すべて</button>
        <button class="tab-btn" data-status="pending">未入金</button>
        <button class="tab-btn" data-status="paid">入金済み</button>
        <button class="tab-btn" data-status="delivered">対応済み</button>
        <button class="tab-btn" data-status="cancelled">キャンセル</button>
      </div>
      <div id="ordersList"></div>
    </div>

    <!-- Casts tab -->
    <div class="tab-panel" id="tab-casts" style="display:none">
      <div class="card">
        <p class="section-title">キャストを追加</p>
        <label>名前</label>
        <input type="text" id="newCastName">
        <label>写真URL（任意）</label>
        <input type="text" id="newCastPhoto" placeholder="https://...">
        <button class="primary" id="addCastBtn">追加する</button>
      </div>
      <div id="castsList"></div>
    </div>

    <!-- Drinks tab -->
    <div class="tab-panel" id="tab-drinks" style="display:none">
      <div class="card">
        <p class="section-title">ドリンクを追加</p>
        <label>名前</label>
        <input type="text" id="newDrinkName">
        <label>価格（円）</label>
        <input type="text" id="newDrinkPrice" inputmode="numeric">
        <button class="primary" id="addDrinkBtn">追加する</button>
      </div>
      <div id="drinksList"></div>
    </div>

    <!-- Settings tab -->
    <div class="tab-panel" id="tab-settings" style="display:none">
      <div class="card">
        <p class="section-title">店舗名</p>
        <input type="text" id="settingShopName">
      </div>
      <div class="card">
        <p class="section-title">PayPay ID</p>
        <input type="text" id="settingPaypay">
      </div>
      <div class="card">
        <p class="section-title">銀行振込先</p>
        <textarea id="settingBank"></textarea>
      </div>
      <button class="primary" id="saveSettingsBtn">保存する</button>
      <p class="error-text" id="settingsMsg" style="display:none"></p>
    </div>

    <!-- Account tab -->
    <div class="tab-panel" id="tab-account" style="display:none">
      <div class="card">
        <p class="section-title">パスワード変更</p>
        <label>現在のパスワード</label>
        <input type="text" id="curPass" style="-webkit-text-security: disc;">
        <label>新しいパスワード（6文字以上）</label>
        <input type="text" id="newPass" style="-webkit-text-security: disc;">
        <button class="primary" id="changePassBtn">変更する</button>
        <p class="error-text" id="passMsg" style="display:none"></p>
      </div>
    </div>
  </div>
</div>

<script src="/admin/admin.js"></script>
</body>
</html>
